<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#155E75">
<meta name="mobile-web-app-capable" content="yes">
<title>Consignment Log</title>
<style>
:root {
  /* dark theme */
  --brand: #1597b8; --brand-deep: #0e5b70; --brand-soft: #0f3a46; --ink: #e7f1f5; --muted: #8fa7b1; --line: #26414c; --paper: #142a33;
  --bg: #0b1a20; --raise: #1b3640; --green: #34d07a; --green-soft: #133b27; --red: #ff6b6b; --red-soft: #45191c; --amber: #f5b14c; --amber-soft: #3f2e12;
  --indigo: #7c83ff; --indigo-soft: #23264d;
  --r: 16px; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.28);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
html, body { margin: 0; height: 100%; }
body { font: 16px/1.35 system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; background: var(--raise); }
input::placeholder { color: var(--muted); }
#app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: linear-gradient(120deg, #0a3a47, #0e6a84); border-bottom: 1px solid #1f4a57; color: #fff; flex: none; }
.top .logo { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.top .logo svg { width: 26px; height: 26px; }
.top h1 { font-size: 1.35rem; margin: 0; font-weight: 800; letter-spacing: .01em; white-space: nowrap; }
.top .sub { white-space: nowrap; }
#bHome { display: none !important; }   /* each screen has its own Home button */
.top .sub { font-size: .85rem; opacity: .85; }
.top .sp { flex: 1; }
.top .tb { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.top .tb:hover { background: rgba(255,255,255,.22); }
.top .tb svg { width: 18px; height: 18px; }

main { flex: 1; overflow: auto; padding: 22px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.h2 { font-size: 1.05rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 26px 2px 12px; }

/* home */
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.action { border: 0; border-radius: 22px; padding: 26px 24px; text-align: left; color: #fff; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-height: 170px; transition: transform .12s, box-shadow .12s; }
.action:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.action:active { transform: scale(.98); }
.action .ic { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.2); display: grid; place-items: center; }
.action .ic svg { width: 30px; height: 30px; }
.action b { font-size: 1.45rem; display: block; }
.action span { opacity: .9; font-size: .95rem; display: block; margin-top: 6px; }
.a-pull { background: linear-gradient(135deg, #0b6f8a, #13a3c6); }
.a-recv { background: linear-gradient(135deg, #17834a, #26b866); }
.a-count { background: linear-gradient(135deg, #4b4fd6, #7377ff); }

.stock { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.sc { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; border-top: 5px solid var(--c); }
.sc .nm { font-weight: 800; font-size: 1rem; }
.sc .big { font-size: 2.6rem; font-weight: 800; line-height: 1.1; margin: 6px 0 2px; color: var(--c); }
.sc .big small { font-size: .9rem; font-weight: 700; color: var(--muted); margin-left: 4px; }
.sc .meta { font-size: .8rem; color: var(--muted); }
.sc .meta b { color: var(--ink); }
.counted-today { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.ok { background: var(--green-soft); color: var(--green); } .bad { background: var(--red-soft); color: var(--red); } .warn { background: var(--amber-soft); color: var(--amber); }

/* screens */
.screenhead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.back { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.screenhead h2 { margin: 0; font-size: 1.5rem; }
.screenhead .hint { color: var(--muted); font-size: .92rem; }

/* pull */
.pull { display: grid; grid-template-columns: 290px 1fr; gap: 20px; align-items: start; }
.drugs { display: flex; flex-direction: column; gap: 10px; }
.dbtn { border: 2px solid transparent; background: var(--paper); border-radius: 16px; padding: 16px 16px; text-align: left; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.05rem; }
.dbtn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; }
.dbtn .n { margin-left: auto; min-width: 32px; text-align: center; border-radius: 999px; background: var(--raise); padding: 2px 9px; font-size: .9rem; }
.dbtn.on { border-color: var(--c); background: var(--c09); }
.dbtn.on .n { background: var(--c); color: #0b1a20; }
.scanbox { background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 22px; }
.target { border: 3px dashed var(--c55); border-radius: 18px; padding: 26px; text-align: center; background: var(--c06); transition: background .2s; }
.target.flash { background: var(--c22); }
.target .big { font-size: 1.6rem; font-weight: 800; }
.target .big em { font-style: normal; color: var(--c); }
.target .small { color: var(--muted); margin-top: 6px; }
.target .typer { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
.target input { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; width: 220px; font-size: 1.1rem; }
.lnk { border: 0; background: none; color: var(--brand); font-weight: 700; text-decoration: underline; padding: 6px; }
.batch { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; max-height: 42vh; overflow: auto; }
.bi { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.bi .num { color: var(--muted); font-size: .85rem; width: 26px; text-align: right; }
.bi .rx { font: 800 1.1rem ui-monospace, Consolas, monospace; }
.chip { border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: .82rem; color: #0b1a20; background: var(--c); display: inline-flex; gap: 6px; align-items: center; }
.bi .x { margin-left: auto; border: 0; background: var(--raise); border-radius: 10px; width: 38px; height: 38px; font-size: 1.1rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 22px; }
.bar { position: sticky; bottom: 0; margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--paper); border-radius: 18px; box-shadow: 0 -2px 18px rgba(0,0,0,.35); padding: 14px; }
.bar .tot { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
.btn { border: 0; border-radius: 14px; padding: 15px 24px; font-weight: 800; font-size: 1.05rem; background: var(--brand); color: #fff; box-shadow: var(--shadow); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.green { background: #1f9d58; } .btn.indigo { background: #5b5fe0; } .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: none; } .btn.red { background: var(--red); }
.btn.wide { width: 100%; }

/* receive */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 22px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 20px 0; }
.stepper button { width: 70px; height: 70px; border-radius: 50%; border: 0; font-size: 2rem; font-weight: 800; background: var(--raise); }
.stepper input { width: 130px; text-align: center; font-size: 2.6rem; font-weight: 800; border: 2px solid var(--line); border-radius: 16px; padding: 6px; }
.field { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }

/* count */
.crow { display: grid; grid-template-columns: 1.3fr .7fr 1.2fr 1fr; gap: 14px; align-items: center; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 18px; border-left: 6px solid var(--c); margin-bottom: 12px; }
.crow .nm { font-weight: 800; font-size: 1.1rem; }
.crow .sub { font-size: .8rem; color: var(--muted); margin-top: 3px; }
.crow .exp { text-align: center; } .crow .exp b { display: block; font-size: 2rem; } .crow .exp span { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.crow .cin { display: flex; align-items: center; gap: 8px; justify-content: center; }
.crow .cin button { width: 52px; height: 52px; border-radius: 14px; border: 0; background: var(--raise); font-size: 1.6rem; font-weight: 800; }
.crow .cin input { width: 90px; text-align: center; font-size: 1.8rem; font-weight: 800; border: 2px solid var(--line); border-radius: 14px; padding: 6px; }
.crow .st { text-align: center; font-weight: 800; border-radius: 12px; padding: 10px; }
.crow .more { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crow .more .rxp { font: 700 .8rem ui-monospace, Consolas, monospace; background: var(--raise); color: var(--ink); border-radius: 8px; padding: 3px 8px; }

/* history */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.fbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; font-weight: 700; }
.fbtn.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.fbtn { color: var(--ink); }
.day { font-weight: 800; color: var(--muted); margin: 18px 4px 8px; }
.hi { display: flex; gap: 12px; align-items: center; background: var(--paper); border-radius: 14px; padding: 12px 14px; margin-bottom: 6px; box-shadow: var(--shadow); }
.hi .t { width: 82px; color: var(--muted); font-size: .85rem; font-weight: 700; }
.hi .ty { font-size: .72rem; font-weight: 800; border-radius: 8px; padding: 3px 8px; text-transform: uppercase; letter-spacing: .04em; }
.ty-PULL { background: var(--brand-soft); color: var(--brand-deep); } .ty-RECEIVE { background: var(--green-soft); color: var(--green); } .ty-COUNT { background: var(--indigo-soft); color: var(--indigo); } .ty-VOID { background: var(--raise); color: var(--muted); }
.hi .what { flex: 1; } .hi .what .rx { font: 800 1rem ui-monospace, Consolas, monospace; }
.hi.voided .what { text-decoration: line-through; opacity: .55; }
.hi .undo { border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: .85rem; color: var(--muted); }

/* drugs */
.drow { display: grid; grid-template-columns: 34px 1.6fr 1fr 110px 110px 92px; gap: 10px; align-items: center; background: var(--paper); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.drow input, .drow select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
.drow .mv { display: flex; gap: 4px; } .drow .mv button { border: 1px solid var(--line); background: var(--raise); color: var(--ink); border-radius: 8px; width: 42px; height: 38px; }

/* step guide at the top of each screen: what to do, in order */
.steps { display: flex; gap: 10px; margin: -4px 0 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 10px 16px; font-weight: 800; font-size: 1.02rem; color: var(--muted); }
.step .no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); color: var(--muted); font-size: .95rem; }
.step.now { border-color: var(--brand); color: var(--ink); box-shadow: 0 0 0 4px rgba(21,151,184,.18); }
.step.now .no { background: var(--brand); color: #fff; }
.step.ok { color: var(--ink); } .step.ok .no { background: #1f9d58; color: #fff; }
.btn { min-height: 56px; }
.btn.big { font-size: 1.2rem; padding: 18px 30px; }

/* dialogs + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 20px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dlg { background: var(--paper); border-radius: 24px; max-width: 620px; width: 100%; max-height: 90vh; overflow: auto; padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,.3); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(14px); opacity: 0; } }
.dlg h3 { margin: 0 0 8px; font-size: 1.4rem; }
.dlg p { color: var(--muted); margin: 0 0 14px; }
.dlg .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.tbl { width: 100%; border-collapse: collapse; margin-top: 8px; }
.tbl td, .tbl th { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.tbl th { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tbl td.r, .tbl th.r { text-align: right; }
.stamp { display: inline-flex; gap: 8px; align-items: center; background: var(--green-soft); color: var(--green); font-weight: 800; border-radius: 12px; padding: 10px 14px; margin: 6px 0 4px; }
.bigcheck { width: 76px; height: 76px; border-radius: 50%; background: #1f9d58; color: #fff; display: grid; place-items: center; margin: 4px auto 14px; }
.bigcheck svg { width: 42px; height: 42px; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #e7f1f5; color: #0b1a20; padding: 12px 20px; border-radius: 14px; font-weight: 700; z-index: 60; box-shadow: var(--shadow); }
.loading { display: grid; place-items: center; height: 60vh; color: var(--muted); font-weight: 700; }
.spin { width: 38px; height: 38px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* portrait (the Fire tablet: about 800 px wide) */
@media (max-width: 860px) {
  main { padding: 18px 16px 24px; }
  .actions { grid-template-columns: 1fr; gap: 14px; }
  .action { min-height: 0; flex-direction: row; align-items: center; gap: 18px; padding: 24px 22px; }
  .action .ic { width: 64px; height: 64px; flex: none; } .action .ic svg { width: 36px; height: 36px; }
  .action b { font-size: 1.6rem; display: block; } .action span { display: block; margin-top: 4px; font-size: 1rem; }
  .stock { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pull { grid-template-columns: 1fr; gap: 14px; }
  .drugs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .dbtn { padding: 16px 12px; font-size: 1rem; }
  .steps { gap: 8px; } .step { padding: 8px 12px; font-size: .95rem; } .step .no { width: 26px; height: 26px; }
  .crow { grid-template-columns: 1fr auto; gap: 12px 16px; }
  .crow .cin { justify-content: flex-start; }
  .crow .st { padding: 14px; }
  .drow { grid-template-columns: 1fr 1fr; }
  .batch { max-height: 34vh; }
}
@media (max-width: 600px) { .top .tb span { display: none; } .drugs { grid-template-columns: repeat(2, 1fr); } .stock { grid-template-columns: repeat(2, 1fr); } }
</style></style>
</head>

  </div>
  <main><div class="wrap" id="view"><div class="loading"><div><div class="spin"></div>Loading…</div></div></div></main>
</div>
<div id="toast" hidden></div>

<script>
(() => {
  const COLORS = ["#22b8d8", "#a78bfa", "#f472b6", "#fb923c", "#4ade80", "#60a5fa", "#fbbf24", "#2dd4bf", "#c084fc", "#fb7185"];

  const I = {

    recv: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',

    v.append(head("History", "The last 7 days. Undo a scan or receipt logged by mistake (it stays here, crossed out)."));
    const types = [["all", "Everything"], ["PULL", "Pulls"], ["RECEIVE", "Received"], ["COUNT", "Counts"]];
    const search = el("input", { class: "field", style: { maxWidth: "220px" }, placeholder: "Find an Rx number", value: hRx, inputmode: "numeric",
      oninput: (e) => { hRx = e.target.value.trim().toUpperCase(); draw(); } });
    const sel = el("select", { class: "field", style: { maxWidth: "200px" }, onchange: (e) => { hDrug = e.target.value; draw(); } },
      el("option", { value: "", text: "All drugs" }), S.drugs.map(d => el("option", { value: d.id, text: d.short, selected: hDrug === d.id })));
    v.append(el("div", { class: "filters" }, types.map(([k, n]) => el("button", { class: "fbtn" + (hType === k ? " on" : ""), onclick: () => { hType = k; render(); } }, n)), sel, search));
    const out = el("div"); v.append(out);
    function draw() {
      out.textContent = "";
      const rows = S.history.filter(h => h.type !== "VOID" && (hType === "all" || h.type === hType) && (!hDrug || h.drugId === hDrug) && (!hRx || h.rx.includes(hRx)));
      if (!rows.length) { out.append(el("div", { class: "empty", text: "Nothing here." })); return; }
      let day = "";
      for (const h of rows) {
        const dd = fmtDay(h.time); if (dd !== day) { day = dd; out.append(el("div", { class: "day", text: dd })); }
        const what = h.type === "PULL" ? [el("span", { class: "chip", style: cs(color(h.drugId)), text: h.drug }), " ", el("span", { class: "rx", text: h.rx })]
          : h.type === "RECEIVE" ? [el("span", { class: "chip", style: cs(color(h.drugId)), text: h.drug }), ` +${h.qty} received` + (h.note ? " · " + h.note : "")]
          : [el("span", { class: "chip", style: cs(color(h.drugId)), text: h.drug }), ` counted ${h.counted}` + (h.expected === null ? " (first count)" : ` · expected ${h.expected} `),
             h.expected === null ? null : el("span", { class: "counted-today " + (h.diff ? "bad" : "ok"), text: h.diff ? (h.diff > 0 ? "+" : "") + h.diff : "match" })];
        out.append(el("div", { class: "hi" + (h.voided ? " voided" : "") }, el("span", { class: "t", text: fmtTime(h.time) }), el("span", { class: "ty ty-" + h.type, text: h.type === "PULL" ? "Pulled" : h.type === "RECEIVE" ? "Received" : "Count" }),
          el("div", { class: "what" }, what),
          (h.type === "PULL" || h.type === "RECEIVE") && !h.voided ? el("button", { class: "undo", onclick: async () => {
            if (!(await ask("Undo this " + (h.type === "PULL" ? "scan" : "receipt") + "?", h.drug + (h.rx ? " · Rx " + h.rx : " · " + h.qty) + " · " + fmtWhen(h.time), "Yes, undo", "Cancel"))) return;
            try { await api("voidEntry", h.id); toast("Undone."); await load(); } catch (e) { toast(e.message, 6000); }
          } }, "Undo") : h.voided ? el("span", { class: "t", text: "undone" }) : null));
      }
    }
    draw();
  }

  // ---------------------------------------------------------------- drug list
  let edit = null;
  function drugs(v) {
    v.append(head("Drugs in the safe", "Add a drug, rename it, or hide one you no longer keep. Hidden drugs keep their history."));
    if (!edit) edit = S.drugs.map(d => ({ id: d.id, name: d.name, short: d.short, unit: d.unit, active: d.active }));
    edit.forEach((d, i) => v.append(el("div", { class: "drow" },
      el("span", { class: "dot", style: { width: "16px", height: "16px", borderRadius: "50%", background: COLORS[i % COLORS.length] } }),
      el("input", { value: d.name, placeholder: "Full name", oninput: (e) => d.name = e.target.value }),
      el("input", { value: d.short, placeholder: "Short name", oninput: (e) => d.short = e.target.value }),
      el("select", { onchange: (e) => d.unit = e.target.value }, el("option", { value: "bottle", text: "Bottles", selected: d.unit !== "box" }), el("option", { value: "box", text: "Boxes", selected: d.unit === "box" })),
      el("select", { onchange: (e) => d.active = e.target.value === "1" }, el("option", { value: "1", text: "Shown", selected: d.active }), el("option", { value: "0", text: "Hidden", selected: !d.active })),
      el("div", { class: "mv" }, el("button", { text: "↑", disabled: i === 0, onclick: () => { [edit[i - 1], edit[i]] = [edit[i], edit[i - 1]]; render(); } }),
        el("button", { text: "↓", disabled: i === edit.length - 1, onclick: () => { [edit[i + 1], edit[i]] = [edit[i], edit[i + 1]]; render(); } })))));
    v.append(el("div", { class: "bar" }, el("button", { class: "btn ghost", text: "+ Add a drug", onclick: () => { edit.push({ id: "", name: "", short: "", unit: "bottle", active: true }); render(); } }),
      el("div", { class: "tot" }), el("button", { class: "btn ghost", text: "Cancel", onclick: () => { edit = null; go("home"); } }),
      el("button", { class: "btn", text: "Save drug list", onclick: async (e) => {
        e.target.disabled = true;
        try { await api("saveDrugs", edit); edit = null; toast("Drug list saved."); screen = "home"; await load(); }
        catch (err) { e.target.disabled = false; toast(err.message, 6000); }
      } })));
  }

  // ---------------------------------------------------------------- dialogs
  function dialog(title, text, body, buttons) {
    const scrim = el("div", { class: "scrim" });
    const close = () => scrim.remove();
    const btns = el("div", { class: "btns" }, buttons.map(([label, kind, fn]) => {
      const b = el("button", { class: "btn " + kind, text: label });
      b.onclick = async () => { if ((await fn(b)) !== false) close(); };
      return b;
    }));
    scrim.append(el("div", { class: "dlg" }, el("h3", { text: title }), text ? el("p", { text }) : null, body, btns));
    document.body.append(scrim);
    setTimeout(() => { const last = btns.lastElementChild; last && last.focus(); }, 30);
    return close;
  }
  function ask(title, text, yes, no, extra) {
    return new Promise((res) => dialog(title, text, extra ? el("p", { text: extra, style: { fontSize: ".9rem" } }) : null,
      [[no, "ghost", () => { res(false); return true; }], [yes, "", () => { res(true); return true; }]]));
  }
  function done(title, time, results) {
    const body = el("div", { style: { textAlign: "center" } }, el("div", { class: "bigcheck" }, svg(I.check)),
      el("div", { class: "stamp", text: "Confirmed " + fmtDay(time).toLowerCase().replace(/^(?!today|yesterday)/, "") + " at " + new Date(time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }) }),
      results && results.length ? el("table", { class: "tbl", style: { marginTop: "14px" } }, results.map(r => el("tr", {}, el("td", { text: r.drug }),
        el("td", { class: "r", text: (r.expected === null ? "start " : "expected " + r.expected + " · ") + "counted " + r.counted }),
        el("td", { class: "r" }, el("span", { class: "counted-today " + (r.diff ? "bad" : "ok"), text: r.diff === null ? "start" : r.diff ? (r.diff > 0 ? "+" : "") + r.diff : "✓" }))))) : null);
    const close = dialog(title, "", body, [["Done", "", () => true]]);
    if (!results || !results.some(r => r.diff)) setTimeout(close, 6000);
  }

  load();
})();
</script>
</body>
</html>
